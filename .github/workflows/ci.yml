name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 added to narrow the gap with the dev runtime (3.14); pyproject
        # requires >=3.11. Bump to 3.14 here once setup-python ships it stably.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (editable + dev extras, versions pinned by lockfile)
        # requirements.lock is a pip constraints file: it pins the resolved
        # versions for reproducible builds without widening what gets installed.
        # pyproject.toml keeps the compatibility floors.
        run: pip install -e ".[dev]" -c requirements.lock

      # scripts/ included: an undefined name there (F821) silently killed the
      # daily calibration staging on 2026-07-01 -- entrypoints must be linted.
      - name: Ruff (lint)
        run: ruff check src scripts tests

      # mypy estaba configurado en pyproject y pineado en el lock, pero CI nunca
      # lo ejecutaba: la puerta estaba verde sin coste de deteccion, asi que una
      # regresion de tipos entraba sin aviso (auditoria 2026-07-29, S-5). Una
      # sola pata de la matriz basta.
      - name: MyPy (tipos)
        if: matrix.python-version == '3.12'
        run: mypy src

      - name: Pytest
        # pythonpath=["src"] is set in pyproject, so no PYTHONPATH needed.
        if: matrix.python-version != '3.12'
        run: pytest -q

      # Informational coverage on one matrix leg only (3.12): prints the
      # per-module table in the log without failing the build (no threshold).
      - name: Pytest (+ coverage report, informational)
        if: matrix.python-version == '3.12'
        run: |
          pip install pytest-cov
          pytest -q --cov=sqp --cov-report=term

      # BLOCKING since 2026-07-02: the lockfile was audited clean after bumping
      # idna (PYSEC-2026-215) and urllib3 (PYSEC-2026-141/142). Audits the pinned
      # set in requirements.lock so results are deterministic. If a new advisory
      # blocks an unrelated PR, bump the pinned package in requirements.lock
      # (keeping pyproject floors satisfied) in that same PR.
      - name: Dependency vulnerability audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock

  # Production runs on Windows (Task Scheduler + BATs); one Windows leg catches
  # path/locale/os.replace regressions that ubuntu can't. Single Python version
  # to keep minutes bounded (Windows runners cost 2x).
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (editable + dev extras, pinned)
        run: pip install -e ".[dev]" -c requirements.lock
      - name: Pytest
        run: pytest -q
