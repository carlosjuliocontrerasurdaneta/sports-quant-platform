name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 added to narrow the gap with the dev runtime (3.14); pyproject
        # requires >=3.10. Bump to 3.14 here once setup-python ships it stably.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (editable + dev extras)
        run: pip install -e ".[dev]"

      # scripts/ included: an undefined name there (F821) silently killed the
      # daily calibration staging on 2026-07-01 -- entrypoints must be linted.
      - name: Ruff (lint)
        run: ruff check src scripts tests

      - name: Pytest
        # pythonpath=["src"] is set in pyproject, so no PYTHONPATH needed.
        run: pytest -q

      # Report-only for now (continue-on-error) so a new advisory surfaces in the
      # logs without blocking unrelated PRs. Flip to blocking once triaged.
      - name: Dependency vulnerability audit (pip-audit)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit
