# Global defaults. Per-sport parameters live in each adapter; per-league soccer configs in configs/leagues/.
risk:
  kelly_fraction: 0.08  # .env production value (2026-08-23); yaml aligned to silence divergence warning
  min_edge: 0.02
  max_stake_pct: 0.02
  max_daily_exposure_pct: 0.10   # per-league cap, applied inside each run_league
  # Global cross-league cap: the WHOLE day's staked exposure across every league
  # is held <= bankroll * this, enforced once after all leagues run. Without it the
  # per-league cap above could compound to N x 10% on a multi-league day. 0 = off.
  max_total_exposure_pct: 0.10
  # Edges above this are flagged as probable miscalibration, not staked. Lowered
  # 0.15 -> 0.075 (project-2 ceiling) on 2026-06-22 OOS evidence: on captured odds
  # MLB test ROI +0.41% -> +2.42% (profit +19 -> +51) at half the staked exposure;
  # aggregate +0.24% -> +0.71%, exposure ~halved. WNBA contradicts on a tiny n=62.
  # Still ~break-even (single-snapshot proxy) -> risk control, not a profit claim.
  max_plausible_edge: 0.075
  market_shrink: 0.5         # blend model prob toward no-vig market: p=(1-s)*model+s*market
  # EV uncertainty penalty (ported from project 2; see sqp.markets.edge). Deflates
  # the edge by the model-vs-market gap and folds it into the staked probability,
  # so it shrinks the Kelly stake too. ENABLED 2026-06-21 after a walk-forward OOS
  # over captured odds (1654 bets, mostly MLB): aggregate realized ROI -0.74% ->
  # +0.37% and staked exposure roughly halved (MLB and WNBA both improved). Still
  # ~break-even and in-sample on parameters -> not a profit claim. Disable by
  # setting the coefficients to 0. max_plausible_edge was later validated and
  # lowered separately to 0.075 (see above).
  uncertainty_penalty: 0.35
  anomaly_edge_gap: 0.06
  anomaly_extra_penalty: 0.02
  low_book_penalty: 0.015
  min_books_for_consensus: 2
  # Adverse line-movement penalty. When the implied-prob consensus moved against
  # the pick by more than line_movement_flat_pp pp, the edge is deflated by
  # abs(movement_pp) * line_movement_penalty. 0 = no-op (off by default;
  # activate only after OOS evidence confirms the signal adds value).
  line_movement_penalty: 0.0
  line_movement_flat_pp: 0.5
  # Adverse velocity penalty: penalizes picks where consensus moved against
  # them faster than line_velocity_flat_pp_per_h pp/h. 0 = no-op.
  line_velocity_penalty: 0.0
  line_velocity_flat_pp_per_h: 0.5
  # Rest days and recent form adjustments. Additive correction to p_model
  # before the market shrink and edge calculation. 0 = no-op (default).
  rest_days_coef: 0.0
  recent_form_coef: 0.0
  recent_form_n: 5
  # Books-spread penalty: deflates edge when bookmakers disagree on the fair
  # price. spread = std dev of implied probs across books. 0 = no-op.
  # e.g. books_spread_threshold: 0.02, books_spread_penalty: 0.5
  books_spread_penalty: 0.0
  books_spread_threshold: 0.0
  # Head-to-head historical adjustment (h2h market only). Centered at 0.5:
  # a team with 70% H2H win rate gets +(0.70-0.50)*h2h_coef pp. 0 = no-op.
  h2h_coef: 0.0
  h2h_n: 10
  # Totals scoring-tendency adjustment: compares the avg combined score of both
  # teams over their last totals_tendency_n games vs the totals line.
  # adj = (combined_avg - point) * coef; Over gets +adj, Under -adj. 0 = no-op.
  # e.g. both teams avg 5.5 runs, line is 8.0 → combined 5.5 vs 8 → favor Under.
  totals_tendency_coef: 0.0
  totals_tendency_n: 10
# Bankroll. current balance = initial + realized PnL (real settled bets) + manual
# adjustments (data/bets/bankroll_adjustments.csv). dynamic ENABLED 2026-06-21
# Current audit: 915.75 = 1000 - 84.25 over 431 graded bets. When dynamic, the live run sizes Kelly +
# the daily-exposure cap on the running balance; demo keeps the static initial.
# See sqp.risk.bankroll; audit anytime with scripts/bankroll_status.py.
bankroll:
  initial: 1000
  dynamic: true
odds:
  regions: "us,eu"
  markets: "h2h,spreads,totals"
  odds_format: "decimal"
simulation:
  n_sims: 20000
  seed: 42
# Modo de seleccion de picks. ACTIVO: "edge" -- seleccion clasica por valor
# esperado (Kelly fraccional sobre min_edge, los tres mercados).
#
# REVERTIDO a "edge" el 2026-07-31 por decision explicita del operador. La
# historia corta, porque explica por que no conviene volver a cambiarlo sin
# evidencia:
#
#   2026-07-27  El objetivo se cambio a "maximizar % de aciertos" porque los
#               picks por valor acertaban poco.
#   2026-07-28  Se activo "accuracy": probabilidad >= 0.70, SOLO moneyline,
#               stake plano.
#   2026-07-31  Revertido. El modo accuracy elegia favoritos extremos (cuotas
#               reales observadas en produccion: 1.07, 1.10, 1.16). A cuota 1.07
#               el punto de equilibrio es 1/1.07 = 93.5% de aciertos: el modo
#               subia el hit rate y perdia dinero POR CONSTRUCCION. Ademas
#               recortaba el sistema a 1 de sus 3 mercados.
#
# La leccion: el hit rate no se juzga contra un umbral fijo, sino contra el
# punto de equilibrio que fija la cuota de cada pick (1/price_decimal). Un 45%
# a cuota 2.50 gana dinero; un 88% a cuota 1.07 lo pierde. Los reportes ahora
# muestran esa comparacion ("necesitabas X%, acertaste Y%").
#
# "accuracy" sigue implementado y probado; reactivarlo exige evidencia fuera de
# muestra de que su seleccion supera su propio punto de equilibrio.
# Env vars PICK_MODE / ACCURACY_THRESHOLD (cuando estan) ganan sobre yaml.
picks:
  mode: edge
  accuracy_threshold: 0.70
# Per-(league, market) probability calibration applied to live estimates before
# edge/stake. OFF by default: enable only after train_calibration.py shows the
# out-of-sample ECE improves. The retraining target stays uncalibrated.
calibration:
  enabled: true
  method: auto   # isotonic | beta | auto (auto = per-(league,market) best, from calibration_methods.json)
  # Promoción humana por defecto: el retrain diario escribe candidatos en
  # STAGING y nunca cambia el registro LIVE sin una aprobación explícita. La
  # función auto_promote_calibrators conserva sus gates OOS y el mínimo de 30
  # eventos independientes para usos deliberadamente autorizados, pero este
  # archivo no la activa. Promoción manual: scripts/promote_calibration.py.
  auto_promote: false
# Markets suspended from staking (still estimated; picks recorded flagged
# "market_paused", stake 0). MLB totals was paused 2026-06-14 (realized ROI
# negative vs positive estimated edge); UN-PAUSED 2026-06-22 after the ballpark
# run-environment factor (ratings.yaml mlb.park_bound 0.10) fixed totals OOS
# (-17.1% -> +2.8% ROI). Re-pause if realized totals ROI turns negative again.
paused_markets: {}
# Shadow mode (ENABLED 2026-07-04, LIFTED 2026-08-16 by explicit operator
# decision): while true, picks were selected exactly as in real mode but
# recorded with stake 0, flagged "shadow_mode".
#
# Lifting it does NOT by itself put money at risk: the per-market CLV gate below
# is layered UNDER shadow and is default-deny, so every market whose registry
# entry is missing or `allowed: false` still gets stake 0 -- now flagged
# "clv_gate" instead of "shadow_mode". As of 2026-08-16 EVERY entry in
# data/bets/clv_gate.json is allowed: false, so the effective stake is still 0
# across the board. The gate is now the single, visible, binding barrier.
#
# CONSEQUENCE TO KNOW: with shadow off, a market becomes stakeable
# AUTOMATICALLY as soon as the daily CLV audit writes `allowed: true` for it
# (median CLV > 0 over >= clv_gate.min_n settled bets matched to a captured
# close). No further human approval is required at that point. To keep approval
# manual, set clv_gate.enabled: false and curate the registry by hand, or set
# shadow_mode back to true.
# Env var SHADOW_MODE (when set) wins over this key.
shadow_mode: false
# CLV gate per (league, market) (ENABLED 2026-07-08): allow-list layered UNDER
# shadow mode. A market may carry real stake only if its median CLV over >=
# min_n settled bets matched to a captured close is positive, per the registry
# data/bets/clv_gate.json rewritten by the daily CLV audit. Default-deny: no
# registry, no entry or thin sample -> stake 0, flag "clv_gate". While
# shadow_mode is true the gate is invisible (shadow already zeroes every stake
# and outranks the flag); it becomes the binding PER-MARKET exit rule when
# shadow mode is lifted, implementing the agreed rule "promote a market to
# real stakes only if its median CLV is positive". Env vars CLV_GATE_ENABLED /
# CLV_GATE_MIN_N (when set) win over these keys.
clv_gate:
  enabled: false
  min_n: 30
# Prediction gate (ENABLED 2026-08-16): SUSTITUYE al de CLV como regla de salida
# rectora. Un (liga, mercado) lleva stake real solo si cumple LAS DOS:
#   1. Su modelo PURO bate al mercado evento a evento -- test de signo pareado,
#      unilateral, empates excluidos, n >= 300 no empatadas y p < 0.05.
#   2. Su EV a stake plano es positivo (acertar mas que el precio no basta si el
#      margen no cubre el vig -- leccion de pick_mode accuracy a cuotas 1.07).
# FUERA DE MUESTRA: solo cuentan filas con game_date posterior al pre-registro
# (2026-08-16). Lo anterior ya fue observado por el analisis que descubrio los
# candidatos; usarlo seria validar sobre la muestra del hallazgo (KI-019).
# Por eso el dia de entrada en vigor niega TODOS los mercados: es lo correcto.
# Registro data/bets/prediction_gate.json, reescrito por
# scripts/update_prediction_gate.py. Default-deny.
# Criterio completo: docs/research/2026-08-16-preregistro-regla-de-salida.md
prediction_gate:
  enabled: true
# Monitor de degradacion por (liga, mercado) (ENABLED 2026-07-13): auto-pausa
# gated, capa conservadora que alimenta paused_markets por UNION (nunca
# des-pausa lo listado arriba ni sube stakes). Sobre la ventana movil de
# liquidadas win/loss, un mercado con n >= min_n se PAUSA si el Brier de la
# probabilidad estimada es peor que el del mercado (prob. implicita sin vig)
# por mas de brier_margin, o si su ROI realizado a stake plano (1 unidad por
# pick; los stakes reales son 0 bajo shadow) cae bajo roi_pause. Se REANUDA
# solo con histeresis: Brier <= mercado Y roi_flat >= roi_resume. Con muestra
# insuficiente el estado NO cambia. Registro: data/bets/degradation_pause.json;
# transiciones: data/bets/degradation_log.csv. Precedente que automatiza:
# mlb_totals pausado a mano 2026-06-14 (ROI realizado negativo con edge
# estimado positivo). Env vars DEGRADATION_* (cuando estan) ganan sobre yaml.
degradation_monitor:
  enabled: true
  window_days: 60
  min_n: 30
  brier_margin: 0.01
  roi_pause: -0.15
  roi_resume: -0.05

# Segundo pase pre-partido (2026-07-14): tras cada captura de cierre horaria,
# re-valida el edge de los picks del dia con evento inminente contra el
# consenso vigente y REVOCA (stake 0, flag stale_edge_revoked, rastro en
# data/bets/revalidation_log.csv) los que ya no se generarian (edge actual <
# min_edge). Un revoke es final; un keep se re-evalua cada pase. Sin snapshot
# fresco (<= price_max_age_min) no actua. Solo baja stakes, nunca los sube.
# Bajo shadow es medicion pura (revocados vs mantenidos comparables en CLV).
# Env vars REVALIDATION_* (cuando estan) ganan sobre yaml.
revalidation:
  enabled: true
  window_min: 120
  price_max_age_min: 90

# Observatorio de edge intradia (2026-07-14): en cada pase de captura loguea
# el edge h2h de las probabilidades servidas a las 11:00 contra el consenso
# del snapshot fresco (data/bets/intraday_edge_log.csv). Medicion pura: nunca
# crea picks ni toca stakes; construye el dataset que decide con evidencia la
# fase ofensiva de generacion intradia (#4). Env INTRADAY_SCAN_ENABLED gana.
intraday_scan:
  enabled: true

# Weather feature via Open-Meteo (no API key required).
# Venue coordinates: configs/venues.yaml (keyed by normalized team name).
# When enabled, fetches hourly temperature, precipitation and wind speed for
# each event venue at start time. Responses cached per venue-day.
# Coefficients activate the adverse-weather penalty on totals markets:
#   wind_coef_totals < 0  → reduce p(Over) per km/h above threshold
#   precip_coef_totals < 0 → reduce p(Over) per mm of precipitation
# Both default to 0 (no-op); activate with OOS evidence.
weather:
  enabled: false
  timeout_s: 10
  wind_threshold_kmh: 20.0
  wind_coef_totals: 0.0
  precip_coef_totals: 0.0
