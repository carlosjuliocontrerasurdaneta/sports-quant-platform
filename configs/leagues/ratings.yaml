# Per-league rating overrides estimated by scripts/tune_ratings.py
# elo_home_away_split: true  -- maintains separate home/away Elo ratings per
#   team instead of a single rating + fixed home_advantage offset. The split
#   captures teams that over/underperform dramatically at home vs away. Activate
#   per-league only after OOS validation (default: false = unified Elo).
# (walk-forward grid search on data/historical/, accepted only when they
# beat the family default OUT-OF-SAMPLE under a rolling-origin holdout).
# Re-validate on new games and re-tune after season changes.
leagues:
  bundesliga:
    dc_rho: -0.2
    elo_home_adv: 15.0
  epl:
    dc_rho: -0.2
    elo_home_adv: 15.0
  mlb:
    # Abridor ACTIVADO 2026-09-26 por orden del operador. Valor = minimo log loss
    # del walk-forward sobre 9.629 juegos (RA, bound 0.05: -0.00087 vs bound 0,
    # ECE 0.0077->0.0061). NO supera el margen de aceptacion 0.002: activacion
    # por orden, no por evidencia concluyente. Decisiones previas (0.0): v1 RA
    # rechazada 2026-06-12, v2 FIP empatada 2026-06-16.
    pitcher_bound: 0.05
    pitcher_prior_starts: 5.0
    tilt_scale: 0.4
    # Ballpark run-environment factor on the total (sqp.models.park). ENABLED
    # 2026-06-22: on captured odds it flips MLB totals from -17.1% to +2.8% ROI
    # (held-out -15.9% -> +3.8%/+7.0%) and lifts overall MLB ROI +2.4% -> +7.8%.
    # 0.10 chosen over 0.20 (less over-correction). One season, single-snapshot
    # proxy -> not a profit claim. mlb/totals un-paused alongside this.
    park_bound: 0.10
  mls:
    elo_home_adv: 30.0
    elo_home_away_split: true
  nba:
    # Descanso/back-to-back ACTIVADO 2026-09-26 tras pre-registro con revision
    # Fable (ACEPTA, 5/5 criterios; Δ log loss en afectados -0,00224, IC95
    # [-0,00371; -0,00076]). Valor = c de la particion C (0,79500586), sin
    # re-estimar. Solo NBA; rest_max_days sigue en 4 (default). Ver
    # docs/research/2026-09-26-resultado-descanso-basket.md.
    rest_points_per_day: 0.795
  ncaaf:
    elo_home_adv: 150.0
  nhl:
    elo_home_adv: 15.0
  seriea:
    dc_rho: -0.2
    elo_home_adv: 15.0
