# Soccer leagues are CONFIGURATION, not code. Add a league = add an entry.
# sport_key must match The Odds API key. Each league keeps its own calibration log.
leagues:
  epl:            {sport_key: soccer_epl,                 name: "Premier League",        avg_goals: 2.80}
  laliga:         {sport_key: soccer_spain_la_liga,       name: "La Liga",               avg_goals: 2.65}
  bundesliga:     {sport_key: soccer_germany_bundesliga,  name: "Bundesliga",            avg_goals: 3.20}
  seriea:         {sport_key: soccer_italy_serie_a,       name: "Serie A",               avg_goals: 2.53}
  ligue1:         {sport_key: soccer_france_ligue_one,    name: "Ligue 1",               avg_goals: 2.84}
  ucl:            {sport_key: soccer_uefa_champs_league,  name: "Champions League",      avg_goals: 3.37}
  ligamx:         {sport_key: soccer_mexico_ligamx,       name: "Liga MX",               avg_goals: 2.85}
  mls:            {sport_key: soccer_usa_mls,             name: "MLS",                   avg_goals: 3.07}
  brasileirao:    {sport_key: soccer_brazil_campeonato,   name: "Brasileirão Série A",   avg_goals: 2.40}
  chile:          {sport_key: soccer_chile_campeonato,    name: "Primera División Chile",avg_goals: 2.71}
  # frauen_bundesliga RETIRADA el 2026-09-06 (orden del operador; cierra KI-005,
  # abierto desde el 2026-06-12). No tiene proveedor de resultados historicos:
  # no existe en el catalogo de ESPN -- verificado entonces contra sus 244 ligas
  # de soccer, y RE-VERIFICADO hoy con peticiones reales a ocho rutas plausibles,
  # todas HTTP 400, mientras los controles `ger.1`, `ger.2` y `uefa.wchampions`
  # devolvian 200. Es la unica liga de este fichero sin slug de ESPN.
  #
  # Sin resultados no hay historico, y sin historico: sus ratings dependerian
  # solo de la ventana de 3 dias de The Odds API, no se puede validar OOS, y sus
  # cuotas capturadas consumen cuota de un plan de pago para nada. De hecho
  # nunca llego a servir ni un pick (0 filas servidas, 0 graduadas).
  #
  # La otra via para cerrar KI-005 sigue disponible si algun dia se quiere la
  # liga de vuelta: integrar un vendor alternativo con cobertura femenina alemana
  # (football-data u otro) implementando `ResultsProvider`. Se retira la liga, no
  # la posibilidad.
  uwcl:           {sport_key: soccer_uefa_champs_league_women, name: "UEFA Women's CL",  avg_goals: 3.00}
