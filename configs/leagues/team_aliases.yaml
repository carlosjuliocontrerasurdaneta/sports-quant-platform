    "Augsburg": "FC Augsburg"  # nombre corto vs oficial, mismo club (2026-09-26)
    "Elversberg": "SV Elversberg"  # nombre corto vs oficial, mismo club (2026-09-26)
    "FC Schalke 04": "Schalke 04"  # nombre oficial vs corto, mismo club (2026-09-26)
    "FSV Mainz 05": "Mainz"  # nombre oficial vs corto, mismo club (2026-09-26)
    "Hamburger SV": "Hamburg SV"  # aleman vs ingles, mismo club (2026-09-26)
    "SC Paderborn": "SC Paderborn 07"  # nombre corto vs oficial, mismo club (2026-09-26)
    "Union Berlin": "1. FC Union Berlin"  # nombre corto vs oficial, mismo club (2026-09-26)
  chile:
