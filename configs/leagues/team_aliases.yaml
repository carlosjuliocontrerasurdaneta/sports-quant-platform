# Cross-vendor team-name aliases, per league. Maps any vendor spelling of a
# team to a canonical name, so the ratings built from results (ESPN / MLB Stats
# API names) bind to the live event names (The Odds API).
#
# Matching is accent / case / punctuation insensitive already, so you only need
# entries for GENUINELY different names (abbreviations, nicknames, translations).
# Both sides may be written in natural form; they are reduced to a normalized
# key internally. The canonical (right-hand) value should match a name present
# in your stored results history.
#
# Discover what to add (no API quota; reads persisted data):
#   python scripts/audit_team_names.py --leagues epl nba ligamx
#
# Ships EMPTY on purpose: no mappings are invented. Example of the format:
#
# leagues:
#   epl:
#     "Man City": "Manchester City"
#     "Spurs": "Tottenham Hotspur"
#     "Nott'm Forest": "Nottingham Forest"
#   mlb:
#     "St. Louis Cardinals": "St. Louis Cardinals"   # already auto-matches; example only
#
# Barrido de integridad 2026-09-26 (Carlos): comparadas TODAS las ligas con
# odds capturadas (data/odds/odds_<liga>_*.csv) contra su historico
# (ResultsStore). Las entradas de abajo son SOLO los desajustes donde se pudo
# confirmar, por conocimiento del dominio, que ambas grafias son el MISMO
# equipo (traduccion, sigla, apodo, articulo/prefijo, renombramiento oficial,
# o un caracter que normalize_key no pliega como 'and'/'&' o la 'o' nordica
# o/oslash). Los emparejamientos meramente similares por cadena pero de
# equipos DISTINTOS (p.ej. Inter Milan/AC Milan, Sparta Praga/Slavia Praga,
# New York Red Bulls/NYCFC, Los Angeles Clippers/Lakers) se descartaron
# explicitamente y NO estan aliaseados. Nombres de jugadores de tenis y
# equipos sin historial real (recien ascendidos, ligas sin backfill como
# frauen_bundesliga, o clubes sin partidos aun en su competicion) tampoco se
# aliasearon: quedan documentados en el informe de la sesion, no aqui.
leagues:
  brasileirao:
    "Atletico Mineiro": "Atlético-MG"  # grafia sin acentos vs sigla del historico, mismo club (Atl. Mineiro != America Mineiro) (2026-09-26)
    "Atletico Paranaense": "Athletico-PR"  # grafia con th oficial del club, mismo club (2026-09-26)
    "Bragantino-SP": "Red Bull Bragantino"  # sponsor vs nombre corto, mismo club (2026-09-26)
  bundesliga:
