[project]
name = "sqp"
version = "1.0.0"
description = "Sports Quant Platform: calibrated estimated probabilities for moneyline, spread/handicap and totals across team sports and tennis."
# El lock exige >=3.11 (numpy 2.4 / pandas 3.0); CI corre 3.11-3.13
# (auditoria 2026-07-24, M-15).
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "requests>=2.31",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
# pytest-cov pineado el 2026-08-06 (auditoria F-20): el CI ya publicaba una
# tabla de cobertura informativa, pero en local el comando fallaba por no
# estar instalado, asi que no habia forma de reproducirla.
dev = ["pytest>=7.0", "pytest-cov", "ruff", "mypy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: tests que corren el pipeline completo, entrenan modelos o backtests walk-forward (excluir con '-m \"not slow\"')",
]

[tool.mypy]
files = ["src"]
ignore_missing_imports = true

[tool.ruff]
# Coherente con requires-python (>=3.11): con py310 Ruff no aplicaba los lints
# de 3.11+ que el proyecto si puede usar (auditoria 2026-07-29, S-10).
target-version = "py311"
# `ruff format` NO se adopta (decision 2026-08-05, auditoria I-1). Reformatearia
# 192 de 209 archivos por diferencias de estilo, no de correccion, y el CI no lo
# ejecuta: la puerta de estilo es `ruff check`. Se deja declarado aqui porque el
# estado ambiguo -- herramienta disponible, no adoptada, no documentada -- hacia
# que cada auditoria volviera a plantearselo. Si algun dia se adopta, debe ir en
# un commit propio y aislado, y anadirse al workflow de CI.

[tool.ruff.lint]
# The default rule set (E4/E7/E9 + pyflakes F) is kept, EXCEPT the compact-style
# checks the project uses deliberately: E701 (one-line `if ...: return ...`, e.g.
# settle._grade) and E702 (semicolon-joined setup lines, e.g. test fixtures).
# All pyflakes checks (unused imports/vars, etc.) stay enabled.
ignore = ["E701", "E702"]
