[project]
name = "sqp"
version = "1.0.0"
description = "Sports Quant Platform: calibrated estimated probabilities for moneyline, spread/handicap and totals across team sports and tennis."
# El lock exige >=3.11 (numpy 2.4 / pandas 3.0); CI corre 3.11-3.14
# (auditoria 2026-07-24, M-15). El 3.14 se anadio el 2026-08-06 (auditoria F-09)
# porque es el interprete REAL de produccion: los .bat fijan SQP_PYTHON a
# Python314. El comentario decia "3.11-3.13" desde entonces, ocultando justo la
# pata que valida la maquina que opera (auditoria 2026-09-03, AUD-LOW-002).
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "requests>=2.31",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
# pytest-cov declarado el 2026-08-06 (auditoria F-20) para poder reproducir en
# local la tabla de cobertura informativa del CI.
#
# NO SE PUEDE REPRODUCIR EN EL INTERPRETE DE PRODUCCION (auditoria integral
# 2026-09-10, AUD-MED-007). Con Python 3.14.4 + numpy 2.4.4, CUALQUIER
# invocacion con `--cov` aborta en la recoleccion:
#     ImportError: cannot load module more than once per process
# Reproducido con el caso minimo (`--cov=sqp.markets.odds tests/test_odds.py`):
# 1 error; sin `--cov`, los mismos ficheros dan 47 passed. El CI no lo delata
# porque solo mide cobertura en la pata 3.12 (.github/workflows/ci.yml), que es
# donde sigue funcionando.
#
# Consecuencia practica: la cobertura se mide en 3.12, no en la maquina que
# opera. Una decision de cobertura tomada "en local" en 3.14 no esta medida.
# Ademas `pytest-cov`/`coverage` NO estan pineados en requirements.lock, asi que
# tampoco los audita `pip-audit -r requirements.lock` (AUD-LOW, mismo informe).
dev = ["pytest>=7.0", "pytest-cov", "ruff", "mypy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: tests que corren el pipeline completo, entrenan modelos o backtests walk-forward (excluir con '-m \"not slow\"')",
]

[tool.mypy]
files = ["src"]
ignore_missing_imports = true

[tool.ruff]
# Coherente con requires-python (>=3.11): con py310 Ruff no aplicaba los lints
# de 3.11+ que el proyecto si puede usar (auditoria 2026-07-29, S-10).
target-version = "py311"
# `ruff format` NO se adopta (decision 2026-08-05, auditoria I-1). Reformatearia
# 192 de 209 archivos por diferencias de estilo, no de correccion, y el CI no lo
# ejecuta: la puerta de estilo es `ruff check`. Se deja declarado aqui porque el
# estado ambiguo -- herramienta disponible, no adoptada, no documentada -- hacia
# que cada auditoria volviera a plantearselo. Si algun dia se adopta, debe ir en
# un commit propio y aislado, y anadirse al workflow de CI.

[tool.ruff.lint]
# The default rule set (E4/E7/E9 + pyflakes F) is kept, EXCEPT the compact-style
# checks the project uses deliberately: E701 (one-line `if ...: return ...`, e.g.
# settle._grade) and E702 (semicolon-joined setup lines, e.g. test fixtures).
# All pyflakes checks (unused imports/vars, etc.) stay enabled.
ignore = ["E701", "E702"]
