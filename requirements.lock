# Locked dependency versions for reproducible CI/production installs.
# Generated 2026-07-02 from the production environment (Python 3.14) via
# `pip list --format=freeze`, filtered to sqp's runtime + dev dependency tree.
# Used as a pip CONSTRAINTS file (`pip install -e ".[dev]" -c requirements.lock`),
# so it pins versions without forcing extra packages. pyproject.toml keeps the
# floor requirements (>=) as the source of truth for compatibility ranges.
# NOTE: these versions require Python >=3.11 (numpy 2.4 / pandas 3.0); CI runs
# 3.11-3.13. Regenerate after any deliberate dependency upgrade:
#   pip list --format=freeze | (filter to the names below) > requirements.lock

